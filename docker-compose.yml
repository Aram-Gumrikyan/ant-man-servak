version: "3.8"

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nodejs:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["npm", "start"]
    depends_on:
      - redis
